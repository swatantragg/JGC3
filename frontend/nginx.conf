# Used by the Docker deployment only. On Vercel the equivalent lives in
# frontend/vercel.json — keep the two in step.
server {
    # 8080, not 80: the container runs as an unprivileged user, and ports below
    # 1024 need root to bind. docker-compose maps the host port onto this.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version to anyone scanning for one with
    # a known hole.
    server_tokens off;

    # ---------- Security headers ----------
    # The second wall. The escaping in lib/docs.js and the DOMPurify pass in
    # lib/safeHtml.js are what should stop an injected script; the CSP is what
    # stops one doing anything useful if it ever gets through — it cannot load
    # code from anywhere else, and it cannot send what it steals anywhere else.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # No framing at all: an invisible iframe over a page the user trusts is how
    # a click lands on "delete user".
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # HSTS belongs at whatever terminates TLS. Uncomment when this container is
    # the thing holding the certificate — sending it over plain HTTP does
    # nothing, and sending it from behind a proxy that also sends it duplicates.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Keep uploads and stray large bodies from becoming a memory problem.
    client_max_body_size 4m;

    # SPA routing — every unknown path serves index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container (service name "backend").
    # Docker's embedded DNS, plus a variable in proxy_pass, so the upstream is
    # resolved per request. Without this nginx caches the backend's IP at
    # startup and answers 502 forever after `docker compose up -d --build
    # backend` hands the container a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend;

    location /api/ {
        proxy_pass http://$backend_upstream:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API sets its own headers, including its own CSP; passing ours
        # through as well would produce two policies and the strictest of each
        # would apply, which is not what either file says.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
    }

    # index.html must never be cached: it names the hashed bundle, so a stale
    # copy pins the browser to a version that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Long-cache hashed static assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
